name: Proses approve dan tayangkan

on:
  schedule:
    - cron: "*/20 * * * *"  # tiap 20 menit (GitHub kadang menunda beberapa menit)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Proses tombol Telegram dan tayangkan yang jatuh tempo
        run: python -m src.tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

      - name: Simpan status
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "chore: perbarui status postingan"
          git pull --rebase
          git push
